<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcticswarm BBS Viewer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module" src="/static/app.js"></script>
  <script type="module" src="/static/detail.js"></script>
  <script type="module">
    import { renderQuestionList } from '/static/app.js';
    import { renderDetail } from '/static/detail.js';

    async function route() {
      const hash = window.location.hash || '#/';
      const app = document.getElementById('app');

      if (hash.startsWith('#/question/')) {
        const convId = decodeURIComponent(hash.slice('#/question/'.length));
        await renderDetail(app, convId);
      } else {
        await renderQuestionList(app);
      }
    }

    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
