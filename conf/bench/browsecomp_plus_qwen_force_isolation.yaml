# BrowseComp-Plus — dynamic-BBS swarm on self-hosted Qwen3.5-27B (vLLM),
# against a Snowflake Cortex Search corpus.
#
# FORCE-BBS-ISOLATION ABLATION of the dynamic-BBS BrowseComp-Plus baseline
# (conf/bench/browsecomp_plus_qwen.yaml). This is the mirror
# image of the disable ablation (
# web.disable_bbs_isolation=true):
#   * baseline  -> orchestrator DECIDES per task whether it is isolated
#   * disable   -> NO browsing task is ever isolated (all read the BBS)
#   * force     -> EVERY browsing task is isolated (none read the BBS during
#                  execution); the orchestrator has no isolation decision.
# Everything else is held constant vs the dynamic-BBS baseline (corpus backend,
# tools, budgets, xhigh reasoning, Qwen sampling, reviewer stack, endpoints);
# the ONLY variable is web.force_bbs_isolation.
#
# Isolation is scoped PER TASK EXECUTION and to browsing-profile EXPLORATION
# only. Reviewer tasks are EXEMPT: the builder-reviewer gate runs a browsing
# task that re-checks the leading candidate read from the BBS, so it keeps BBS
# access (a builder acting as reviewer still sees the board); the dedicated
# reviewer uses the reasoning profile and is never isolated. A subagent that
# later runs a reviewer/reasoning task also reads the BBS normally (teammate.py
# restores read_bbs after each isolated task). Because force strips the per-task
# `isolated` option from the create_task schema AND drops the `(isolated=true)`
# hint from the orchestrator prompt (prompts.py), the leader never sees an
# option it cannot use — same treatment disable_bbs_isolation already gets.
#
# NOTE: eval.parallel and llm.agent_model_base_url are launch-time INFRA knobs
# (endpoints rotate; parallel tracks endpoint count) — they do not change model
# behavior, only throughput. Set them to match your serving setup at launch.
#
# CORPUS: web.provider:corpus switches web_search -> CorpusSearchTool and
# web_fetch -> CorpusFetchTool; web_fetch takes a DESCRIPTIVE QUERY (not a URL);
# there is NO pdf_read. Qwen reasoning_effort is a binary thinking toggle
# (xhigh/high both = thinking ON).
#
# Launch (endpoints rotate — set live endpoints at launch; output dir per run):
#   arcticswarm-eval --config conf/bench/browsecomp_plus_qwen_force_isolation.yaml \
#     llm.agent_model_base_url="http://<host-a>:7777/v1,http://<host-b>:7777/v1" \
#     eval.output=results/<run_name>

tools:
  agent: [load_skill, web_search, web_fetch, calculator, read_file]
  orchestrator: [reasoning, load_skill]
  agent_skills: [web-research-corpus, tool-usage-policy-browsing-corpus]
  profiles:
    browsing:
      tools: [web_search, web_fetch, read_file, calculator]
      skills: [web-research-corpus, tool-usage-policy-browsing-corpus]
    reasoning:
      tools: [reasoning]
      skills: [deep-reasoning]

swarm:
  enabled: true
  comm: [bbs]
  orchestrator_prompt_mode: default
  max_teammates: 5
  max_subagents: 16
  max_subagent_tasks: 3
  realtime: false
  enable_force_submit: false
  enforce_alt_task: true
  broadcast_findings: false
  profiles: [browsing, reasoning]
  enable_content_cache: true
  blocking_prepare_report: true
  disable_auditor: false
  auditor_role: author
  auditor_reasoning_effort: high
  auditor_review_stall_s: 60.0
  min_dedicated_reviewers: 1
  min_builder_reviewers: 1
  max_reviewer_remediations: 2

web:
  enabled: true
  provider: corpus
  # Corpus retrieval backend: stub (default; no real retrieval) | cortex | local.
  # Reproducing the paper's BrowseComp-Plus numbers requires pointing
  # corpus_backend: cortex at your OWN Snowflake Cortex Search service and filling
  # in the placeholders below (PAT loaded from ~/.snowflake/connections.toml under
  # the [corpus_pat_connection] profile).
  corpus_backend: stub
  # corpus_backend: cortex
  # corpus_account: <your-snowflake-account>
  # corpus_db: <db>
  # corpus_schema: <schema>
  # corpus_chunked_service: <chunked-service>   # chunked snippets -> web_search
  # corpus_service: <service>                    # full documents  -> web_fetch
  # corpus_pat_connection: <connections.toml profile>
  no_fetch: false
  fetch_backend: corpus
  use_fetch_compactor: false
  use_pdf_compactor: false
  max_tool_output_tokens: 5000
  disable_source_scorer: false
  # No result caching on the corpus path (matches baseline).
  fetch_cache_path: 'off'
  search_repeat_guard_hard_stop: true
  search_neardup_hard_stop: 12
  collapse_duplicate_tool_history: true
  dup_history_keep_last: 1
  browsing_max_search_plans: 2
  browsing_max_reflection_loops: 2
  # --- ablation variable (the ONLY delta vs the dynamic-BBS baseline) ---
  force_bbs_isolation: true

# Behavioral overrides (all LIVE in dynamic-BBS mode).
reject_refusal_reports: true
enable_empty_answer_recovery: true
compaction_prune_junk: true
surface_bbs_candidates: true
enable_candidate_emergence_sweep: true
candidate_emergence_min_chars: 60
candidate_emergence_max_turns: 8

# azure.enabled flips use_azure_openai (judge gating); the vLLM agent client
# ignores it. Needed true for the Azure gpt-4-1-dev judge.
azure:
  enabled: true

llm:
  # Served-id trap: llm.model MUST be slash-free so vllm_served_model_id is
  # applied on the wire (a slash in llm.model silently bypasses it -> 404).
  model: qwen3.5-27b
  vllm_served_model_id: Qwen/Qwen3.5-27B
  # vLLM /v1 endpoint; accepts a comma-separated list of your own endpoints
  # (load-balanced least-connections). Override at launch with your live
  # endpoints (see header). Point at your own vLLM serving setup.
  agent_model_base_url: "http://localhost:7777/v1"
  reasoning_effort: xhigh
  subagent_reasoning_effort: xhigh
  enable_thinking: true
  vllm_temperature: 0.6
  vllm_top_p: 0.95
  vllm_top_k: 20
  vllm_presence_penalty: 0.0
  vllm_max_model_len: 262144            # native 256K window
  disable_closed_model_fallback: true   # no Claude/GPT calls during the run
  max_tokens: 16384                     # matches the qwen baseline family
  compact_tokens: 180000
  max_turns: 1200
  subagent_max_turns: 200
  max_tool_calls_per_turn: 0
  orchestrator_max_tool_calls_per_turn: 0
  timeout: 120

eval:
  judge_model: gpt-4-1-dev
  csv_path: arcticswarm/eval/data/browsecomp_plus_v1.csv
  datasets: [BROWSECOMP_PLUS_V1]
  parallel: 22
  timeout: 20000
  prepare_timeout: 300
  checkpoint_interval: 1
  vip_only: true
  rerun_errors: true
  rerun_timeouts: true
  resume: true
