# BrowseComp benchmark — dynamic swarm with web search, self-hosted Qwen3.5-27B (vLLM).
#
# Runs the WHOLE agent (orchestrator + every subagent + compaction + the
# source-scorer / content-compactor tool LLMs) on the self-hosted Qwen3.5-27B
# vLLM endpoint. The ONLY closed-model call is the eval judge (openai-gpt-4.1),
# which is post-hoc grading and never touches the agent trajectory.
#
# Usage (from a pod labeled dss=true so the in-cluster DNS resolves):
#   arcticswarm-eval --config conf/bench/browsecomp_qwen.yaml \
#     eval.output=results/qwen_baseline odl.hybrid_url=http://127.0.0.1:5003
#
# From a workspace that can't use in-cluster DNS, port-forward first
#   kubectl port-forward -n <namespace> svc/<vllm-service> 9861:6789
# and override: llm.agent_model_base_url=http://localhost:9861/v1

prompt_style: web

tools:
  agent: [read_file, calculator, web_search, web_fetch, pdf_read, python_execute, load_skill]
  orchestrator: [reasoning, load_skill]
  agent_skills: [web-research, tool-usage-policy-browsing]
  profiles:
    browsing:
      tools: [read_file, calculator, web_search, web_fetch, pdf_read]
      skills: [web-research, tool-usage-policy-browsing]
    reasoning:
      tools: [reasoning]
      skills: [deep-reasoning]

swarm:
  enabled: true
  profiles: [browsing, reasoning]
  enable_force_submit: false
  auditor_reasoning_effort: "xhigh"
  # Reviewer-diversity gate: require a VERIFIED #consensus verdict from BOTH a
  # builder (a subagent that searched first-hand) AND the dedicated reasoning
  # auditor before the final report is unlocked. Missing sources are
  # auto-spawned + waited on (bounded by max_reviewer_remediations, then
  # advisory-degrade so the run never hangs). These match the new defaults;
  # listed explicitly so the enforced invariant is visible for this run.
  min_dedicated_reviewers: 1
  min_builder_reviewers: 1
  max_reviewer_remediations: 2
  # Premature-commitment guard (default true): require >=1 ALTERNATIVE/
  # CONTRARIAN task before the report unlocks. If the orchestrator never opens
  # one, PrepareReportTool auto-spawns an `alternative-candidate-sweep` task
  # that searches for a DIFFERENT candidate, then waits for it (single spawn,
  # advisory-degrade on deadline so the run never hangs). Qwen self-initiates
  # an alt task only ~50-67% of the time, so this closes the gap; listed
  # explicitly for visibility.
  enforce_alt_task: true

# Complementary earlier contrarian path: fire the candidate-emergence rival
# sweep as soon as a candidate lands on the BBS (off by default). It posts the
# same `alternative-candidate-sweep` alt task earlier in the run, giving its
# findings more time to influence the answer; the prepare_report alt gate above
# remains the hard backstop.
enable_candidate_emergence_sweep: true

# 0629 anti-give-up + canonical-answer report behavior (top-level, qwen-gated):
# emit the fullest canonical answer form + honor the question's requested format
# (fixes under-specification judge artifacts), and bounce a refusal/give-up
# FINAL ANSWER back for a committed retry (bounded). BrowseComp answers always
# exist, so a give-up scores the same 0 as a committed wrong answer — committing
# the best-supported candidate can only help.
reject_refusal_reports: true

web:
  enabled: true
  # Cap a single web_fetch/pdf_read result to ~5k tokens (~20K chars) so one
  # tool turn can't overflow the 262K window before reactive compaction runs.
  max_tool_output_tokens: 5000

# azure.enabled only flips use_azure_openai (consulted by the judge's gating
# and the closed-model paths we disable below); the vLLM client ignores it.
azure:
  enabled: false

llm:
  model: "qwen3.5-27b"
  # vLLM OpenAI-compatible endpoint (must end in /v1). In-cluster DNS by
  # default; see header for the port-forward alternative.
  agent_model_base_url: "http://localhost:6789/v1"
  reasoning_effort: "xhigh"
  subagent_reasoning_effort: "xhigh"
  # --- Qwen / vLLM knobs ---
  enable_thinking: true                 # Qwen <think> mode (binary; xhigh => on)
  vllm_temperature: 0.6                 # model-card thinking-mode sampling
  vllm_top_p: 0.95
  vllm_top_k: 20
  vllm_presence_penalty: 0.0
  vllm_max_model_len: 262144            # native 256K window
  disable_closed_model_fallback: true   # no Claude/GPT calls during the run
  # Generous per-turn budget so thinking isn't truncated; clamped dynamically
  # against max_model_len by the client. With max_tool_output_tokens capping
  # each tool result, 180K leaves ample headroom below the 262K window.
  max_tokens: 32000
  compact_tokens: 180000
  max_tool_calls_per_turn: 1
  # Orchestrator (swarm leader) runs UNLIMITED tool calls per turn so its
  # batched create_task fan-out + wait_for_tasks aren't silently truncated to
  # 1 (the dropped calls were never re-queued -> lost tasks + near-serial
  # fan-out). Browsing subagents keep the disciplined 1-call/turn above.
  # -1 = inherit the cap above (old behavior); 0 = unlimited orchestrator.
  orchestrator_max_tool_calls_per_turn: 0
  # post_to_bbs always executes even when a subagent batches it past the
  # 1-call cap (e.g. web_search + post_to_bbs -> both run), so a finding a
  # subagent tries to post always lands and is never silently dropped.
  always_execute_tools_per_turn: ["post_to_bbs"]
  timeout: 1200                         # xhigh thinking on 27B is slow; avoid spurious idle timeouts
  max_turns: 1200

eval:
  # Judge runs on a self-hosted Qwen (vLLM, OpenAI-compatible) — no closed
  # model anywhere. Qwen3-30B-A3B-Instruct-2507 is a non-thinking instruct
  # model, so it grades directly (no <think> budget burn). Served id must match
  # the vLLM /v1/models id exactly.
  judge_model: "Qwen/Qwen3-30B-A3B-Instruct-2507"
  judge_model_base_url: "http://localhost:6666/v1"   # in-cluster DNS; port-forward 6666 for workspace runs
  csv_path: arcticswarm/eval/data/browsecomp_subset_representative.csv
  datasets: [BROWSECOMP_V1]
  parallel: 18
  timeout: 6000
  checkpoint_interval: 1
