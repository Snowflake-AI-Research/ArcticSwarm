# BrowseComp-Plus — DUO swarm (leader + auditor) on self-hosted Qwen3.5-27B
# (vLLM), against a Snowflake Cortex Search corpus.
#
# DUO-mode ABLATION of the dynamic-BBS BrowseComp-Plus baseline
# (conf/bench/browsecomp_plus_qwen.yaml). Everything that CAN
# be held constant vs that baseline is held constant (corpus backend, tools,
# budgets, xhigh reasoning, Qwen sampling, endpoints); the ONLY variable is the
# swarm communication architecture: dynamic-BBS -> DUO.
#
# This file lists ONLY flags that actually TAKE EFFECT in DUO mode on the corpus
# backend. Baseline override flags that are verified no-ops here are omitted.
# DUO takes an is_duo early-return (orchestrator.py:896) that skips the entire
# BBS/dynamic-orchestrator path, so ALL of these are inert and left out:
#   surface_bbs_candidates, enable_candidate_emergence_sweep,
#   min_dedicated_reviewers, min_builder_reviewers, max_reviewer_remediations,
#   enforce_alt_task, enable_force_submit, eval.prepare_timeout,
#   enable_empty_answer_recovery (recovery turn is in the non-duo path; intent
#   covered by reject_refusal_reports), orchestrator_max_tool_calls_per_turn
#   (leader is not the orchestrator), swarm.max_subagents (read at orch.py:919,
#   after the is_duo return — duo only ever spawns its single auditor),
#   swarm.auditor_reasoning_effort (the duo auditor is built via for_subagent(),
#   so its effort is driven by llm.subagent_reasoning_effort below, not this).
# Corpus-backend no-ops also omitted (NATIVE-tool-only; corpus provider bypasses
# them in tools/factory.py; no result caching on corpus):
#   web.search_neardup_hard_stop, web.fetch_cache_path
#
# DUO MODE = leader (main worker) + auditor, DM-only, NO orchestrator LLM and NO
# BBS. The leader inherits tools from tools.agent (tools.orchestrator is a no-op
# for the duo leader). Duo REQUIRES realtime:true.
# CORPUS: web.provider:corpus switches web_search -> CorpusSearchTool and
# web_fetch -> CorpusFetchTool (factory.py:184,242). web_fetch takes a
# DESCRIPTIVE QUERY (not a URL); there is NO pdf_read. Qwen reasoning_effort is a
# binary thinking toggle (xhigh/high both = thinking ON).

prompt_style: web

tools:
  # Corpus toolset for the duo LEADER (from tools.agent): NO pdf_read; reasoning
  # included so the leader can reason inline (duo pattern).
  agent: [read_file, calculator, web_search, web_fetch, load_skill, reasoning]
  agent_skills: [tool-usage-policy-browsing-corpus-dm-duo, web-research-corpus]
  # tools.orchestrator is a NO-OP in duo (leader's tools come from tools.agent).
  # The duo leader DOES pull orchestrator_skills, so corpus skills are set on both.
  orchestrator: [load_skill]
  orchestrator_skills: [tool-usage-policy-browsing-corpus-dm-duo, web-research-corpus]
  profiles:
    browsing:
      tools: [calculator, web_search, web_fetch, load_skill, read_file]
      skills: [tool-usage-policy-browsing-corpus-dm-duo, web-research-corpus]
    reasoning:
      tools: [reasoning]
      skills: [deep-reasoning]

web:
  enabled: true
  # Corpus retrieval backend: stub (default; no real retrieval) | cortex | local.
  # Reproducing the paper's BrowseComp-Plus numbers requires pointing
  # corpus_backend: cortex at your OWN Snowflake Cortex Search service and filling
  # in the placeholders below (PAT loaded from ~/.snowflake/connections.toml under
  # the [corpus_pat_connection] profile). No result caching is used on the corpus path.
  provider: corpus
  corpus_backend: stub
  # corpus_backend: cortex
  # corpus_account: <your-snowflake-account>
  # corpus_db: <db>
  # corpus_schema: <schema>
  # corpus_chunked_service: <chunked-service>   # chunked snippets -> web_search
  # corpus_service: <service>                    # full documents  -> web_fetch
  # corpus_pat_connection: <connections.toml profile>
  no_fetch: false
  fetch_backend: corpus
  use_fetch_compactor: false
  use_pdf_compactor: false
  max_tool_output_tokens: 5000
  # Effective, backend-agnostic efficiency levers (tool-history / subagent-loop
  # layer; reach the corpus stream). Match the baseline.
  collapse_duplicate_tool_history: true
  dup_history_keep_last: 1
  browsing_max_reflection_loops: 2

vision: false

swarm:
  enabled: true
  comm: [duo]
  # Duo REQUIRES realtime:true — with realtime:false the leader would try to use
  # prepare_report (stripped from the duo leader), causing a tool-not-found error.
  realtime: true
  profiles: [browsing, reasoning]

# --- behavioral overrides that are LIVE in duo mode (verified) ---
reject_refusal_reports: true          # LIVE: duo SendReportTool bounces refusal/give-up finals (anti-give-up + empty-answer)
compaction_prune_junk: true           # LIVE: Agent/SubAgent proactive-compaction prune (not swarm-gated; leader + auditor)

# azure.enabled flips use_azure_openai (judge gating); the vLLM agent client
# ignores it. Needed true for the Azure gpt-4-1-dev judge.
azure:
  enabled: true

llm:
  # Served-id trap: llm.model MUST be slash-free so vllm_served_model_id is
  # applied on the wire (a slash in llm.model silently bypasses it -> 404).
  model: qwen3.5-27b
  vllm_served_model_id: Qwen/Qwen3.5-27B
  # vLLM /v1 endpoint; accepts a comma-separated list of your own endpoints
  # (load-balanced least-connections). Point at your own vLLM serving setup.
  agent_model_base_url: "http://localhost:7777/v1"
  reasoning_effort: "xhigh"
  subagent_reasoning_effort: "xhigh"   # drives the duo auditor's effort (via for_subagent)
  # --- Qwen / vLLM thinking-mode sampling (model-card values) ---
  enable_thinking: true
  vllm_temperature: 0.6
  vllm_top_p: 0.95
  vllm_top_k: 20
  vllm_presence_penalty: 0.0
  vllm_max_model_len: 262144            # native 256K window
  disable_closed_model_fallback: true   # no Claude/GPT calls during the run
  max_tokens: 16384                     # matches the qwen baseline family (per-turn generation cap)
  compact_tokens: 180000                # matches baseline
  max_tool_calls_per_turn: 1
  subagent_max_turns: 200               # LIVE: the duo auditor IS a SubAgent, so this bites
  timeout: 120                          # matches the qwen baseline family (per-model-call timeout; streaming -> per-read/stall)
  max_turns: 1200

eval:
  judge_model: gpt-4-1-dev
  csv_path: arcticswarm/eval/data/browsecomp_plus_v1.csv
  datasets: [BROWSECOMP_PLUS_V1]
  parallel: 36
  timeout: 20000
  checkpoint_interval: 1
  resume: true
