# BrowseComp — self-hosted Qwen3.5-27B (vLLM), NON-EFFICIENT swarm.
# ArcticSwarm port of snowswarm's browsecomp_qwen_noneff_retrieval.yaml.
#
# "noneff" = every efficiency lever at its non-trimmed default (context_reset
# off, builder-idle on, auditor history kept, max_subagents 16) + the dup-trim
# / query-diversity levers below. This is a clean A/B base against the noneff
# baseline.
#
# PORTING NOTES (snowswarm -> arcticswarm):
#   * The two "retrieval arm" levers from the snowswarm file —
#     web.web_search_count (10) and web.source_scorer_rerank (true) — are NOT
#     ported: ArcticSwarm's native web_search has no count/rerank knob and
#     already defaults to count=5 with no reranking. The original run reverted
#     both to those defaults on the CLI (web.web_search_count=5
#     web.source_scorer_rerank=false), so omitting them is behaviorally
#     identical. (ArcticSwarm raises on unknown YAML/CLI keys, so they must be
#     omitted, not left in.)
#   * The dup-trim + near-dup levers ARE ported and active here:
#     web.collapse_duplicate_tool_history / web.dup_history_keep_last and the
#     integer web.search_neardup_hard_stop.
#
# Usage (override the endpoints for your deployment; eval.output to a NEW dir):
#   arcticswarm-eval --config conf/bench/browsecomp_qwen_noneff_retrieval.yaml \
#     eval.output=/data/soyoon/arcticswarm_results/0623_idle_web_tools \
#     llm.agent_model_base_url="http://soyoung-vllm-qwen35-h2:6792/v1,http://soyoung-vllm-qwen35-b200:6798/v1" \
#     eval.parallel=18 \
#     odl.hybrid_url=http://soyoung-dataloader-cpu:8080
#
# (llm.agent_model_base_url accepts a comma-separated list of vLLM endpoints —
# they're load-balanced least-connections across the eval's parallel workers.)
#
# llm.model / eval.judge_model must match the id your vLLM endpoints serve
# (the /v1/models id). To grade with the Azure GPT-4.1-dev judge instead of the
# self-hosted Qwen judge below, just override: eval.judge_model=gpt-4-1-dev
# (azure.enabled is already true here; needs AZURE_OPENAI_* in settings/env).

prompt_style: web

tools:
  agent: [read_file, calculator, web_search, web_fetch, pdf_read, python_execute, load_skill]
  orchestrator: [reasoning, load_skill]
  agent_skills: [web-research, tool-usage-policy-browsing]
  profiles:
    browsing:
      tools: [read_file, calculator, web_search, web_fetch, pdf_read]
      skills: [web-research, tool-usage-policy-browsing]
    reasoning:
      tools: [reasoning]
      skills: [deep-reasoning]

swarm:
  enabled: true
  profiles: [browsing, reasoning]
  enable_force_submit: false
  auditor_reasoning_effort: "xhigh"
  min_dedicated_reviewers: 1
  min_builder_reviewers: 1
  max_reviewer_remediations: 2
  enforce_alt_task: true
  # --- "noneff" defining flags: all at non-trimmed defaults ---
  context_reset: false
  disable_builder_idle: false
  reset_auditor_history: false
  max_subagents: 16

enable_candidate_emergence_sweep: true

web:
  enabled: true
  collapse_duplicate_tool_history: true   # dup-trim: collapse repeated tool-call results in history
  dup_history_keep_last: 1
  search_neardup_hard_stop: 12            # query-diversity: force-stop reformulation loops at 12 + soft pivot nudge
  disable_source_scorer: false            # source scorer ON (for annotations)
  use_fetch_compactor: true
  use_pdf_compactor: true
  # Cap a single web_fetch/pdf_read result (and the compactor's selected
  # output) to ~5k tokens (~20K chars) so one tool turn can't overflow the
  # 262K window before reactive compaction runs — the dominant prompt-too-long
  # failure mode on this run.
  max_tool_output_tokens: 5000
  browsing_max_reflection_loops: 2

odl:
  # In-cluster DNS default; override odl.hybrid_url for workspace/port-forward runs.
  hybrid_url: "http://soyoung-dataloader-cpu.mltraining-dev.svc.cluster.local:8080"

# azure.enabled only flips use_azure_openai (consulted by the judge gating and
# the closed-model paths disabled below); the vLLM agent client ignores it.
azure:
  enabled: true

llm:
  model: "Qwen/Qwen3.5-27B"
  # vLLM OpenAI-compatible endpoint(s) (must end in /v1). Overridden on the CLI;
  # accepts a comma-separated list for least-connections load-balancing.
  agent_model_base_url: "http://soyoung-vllm-qwen35-vb8:6794/v1"
  reasoning_effort: "xhigh"
  subagent_reasoning_effort: "xhigh"
  # --- Qwen / vLLM knobs (model-card thinking-mode sampling) ---
  enable_thinking: true
  vllm_temperature: 0.6
  vllm_top_p: 0.95
  vllm_top_k: 20
  vllm_presence_penalty: 0.0
  vllm_max_model_len: 262144            # native 256K window
  disable_closed_model_fallback: true   # no Claude/GPT calls during the run
  max_tokens: 32000
  # Proactive-compaction trigger. With max_tool_output_tokens capping each tool
  # result at ~5k tokens, worst-case next-turn context ≈ 180K + 32K (gen) + 5K
  # ≈ 217K < 262K, so 180K is safe and avoids over-compaction churn.
  compact_tokens: 180000
  max_tool_calls_per_turn: 1
  timeout: 1200                         # xhigh thinking on 27B is slow; avoid spurious idle timeouts
  max_turns: 1200

eval:
  # Self-hosted Qwen judge (vLLM, OpenAI-compatible). Served id must match the
  # endpoint's /v1/models id. Override eval.judge_model=gpt-4-1-dev to grade on
  # the Azure GPT-4.1-dev judge instead (azure.enabled is true above).
  judge_model: "Qwen/Qwen3-32B"
  judge_model_base_url: "http://soyoung-vllm-qwen3-32b-judge-svc:6794/v1"
  # NOTE: snowswarm used browsecomp_wrongset172.csv (not in this repo). Swap
  # csv_path to your subset; default is the representative subset shipped here.
  csv_path: arcticswarm/eval/data/browsecomp_subset_representative.csv
  datasets: [BROWSECOMP_V1]
  parallel: 18
  timeout: 9000
  prepare_timeout: 1200
  max_retries: 2
  checkpoint_interval: 1
  resume: true
  rerun_errors: true
