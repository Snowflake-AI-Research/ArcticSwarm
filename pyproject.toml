[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcticswarm"
version = "0.1.0"
description = "A clean, minimal multi-agent web-research agent and benchmark harness."
authors = [{ name = "ArcticSwarm Authors" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.42.0",
    "openai>=1.30.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "snowflake-connector-python>=3.6.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",
    "requests>=2.28.0",
    # Web content extraction (Jina→Serper MCP→MarkItDown chain)
    "markitdown>=0.1.3",
    "mcp>=1.0.0",
    # PDF extraction (opendataloader-pdf hybrid → pypdf fast-path → Jina chain)
    "opendataloader-pdf[hybrid]>=2.0",
    "pypdf>=4.0",
    # Utilities
    "markdown>=3.5",
    "sqlparse>=0.5",
]

[project.scripts]
arcticswarm = "arcticswarm.cli:main"
arcticswarm-eval = "arcticswarm.eval.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["arcticswarm*"]
